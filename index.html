<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/pp1.jpg">
    <title>Hero Section Modren - by JiwanDev</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="hero-background">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
        
        <div class="hero-content">
            <div class="badge">✨ Selamat Datang</div>
            <h1 class="hero-title">
                Wujudkan Ide Digital Anda
                <span class="gradient-text">Bersama Kami</span>
            </h1>
            <p class="hero-subtitle">
                Platform terpercaya untuk mengembangkan bisnis digital Anda dengan solusi inovatif dan modern
            </p>
            <div class="hero-buttons">
                <button class="btn btn-primary">
                    <span>Mulai Gratis</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                    </svg>
                    <span>Lihat Demo</span>
                </button>
            </div>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-number">10K+</div>
                    <div class="stat-label">Pengguna Aktif</div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <div class="stat-number">4.9/5</div>
                    <div class="stat-label">Rating Pengguna</div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <div class="stat-number">24/7</div>
                    <div class="stat-label">Dukungan</div>
                </div>
            </div>
        </div>
    </section>

    <div class="watermark">by JiwanDev</div>

    <script src="script.js"></script>
</body>
</html>
